<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corre em Dia</title>
<meta name="description" content="Contas da semana, blocos do dia 15 e 30, metas e reserva de 3 meses.">
<meta name="theme-color" content="#1d2a3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: app de bolso — cabeçalho com a faixa da semana, conteúdo em cartões, barra de abas fixa embaixo (uso com uma mão, na rua). */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#15202e; --muted:#5d6b7c; --line:#d5dbe3;
  --sign:#f5c400; --sign-ink:#2a2200; --ok:#1f8a4c; --ok-bg:#e1f3e8; --late:#c4321f; --late-bg:#fbe6e2; --warn-bg:#fff5cc;
  --q1:#2f6fd6; --q2:#8a4fd1; --wk:#0f8f8a;
  --road:#1d2a3a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1620; --surface:#18222f; --ink:#e8edf3; --muted:#9aa8b8; --line:#2a3646;
  --sign:#f5c400; --sign-ink:#2a2200; --ok:#4cc27e; --ok-bg:#163525; --late:#ff7a66; --late-bg:#3a1c18; --warn-bg:#3a3210;
  --q1:#6ea2ff; --q2:#b88cff; --wk:#3fc9c2;
  --road:#0a1018; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1620; --surface:#18222f; --ink:#e8edf3; --muted:#9aa8b8; --line:#2a3646;
  --sign:#f5c400; --sign-ink:#2a2200; --ok:#4cc27e; --ok-bg:#163525; --late:#ff7a66; --late-bg:#3a1c18; --warn-bg:#3a3210;
  --q1:#6ea2ff; --q2:#b88cff; --wk:#3fc9c2;
  --road:#0a1018; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--road);color:#fff;padding-block:14px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand h1 .plate{background:var(--sign);color:var(--sign-ink);padding:0 8px;border-radius:4px;transform:skewX(-8deg);display:inline-block}
.sync{font-size:12px;color:#b9c4d2;text-align:right}
main{padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main .wrap{display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
p{margin:0}
.weeknav{display:flex;align-items:center;gap:8px;margin-top:14px}
.weeknav button{background:transparent;border:1px solid #3b4b60;color:#fff;border-radius:8px;width:40px;height:40px;font-size:20px;cursor:pointer;flex:none}
.weeklabel{flex:1;text-align:center;font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.weeklabel small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;text-transform:none;letter-spacing:0;color:#b9c4d2}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.day{border-radius:8px;padding:6px 0 8px;text-align:center;background:#26354a;color:#cdd6e1;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.day b{font-size:17px;color:#fff;font-family:var(--f-display)}
.day.today{outline:2px solid var(--sign)}
.dot{width:7px;height:7px;border-radius:50%;background:transparent}
.dot.due{background:var(--sign)} .dot.paid{background:#4cc27e} .dot.late{background:#ff7a66}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tot{display:flex;flex-direction:column;gap:2px;min-width:0}
.tot span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tot b{font-family:var(--f-display);font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot.falta b{color:var(--late)} .tot.pago b{color:var(--ok)}
.bill{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bill:first-child{border-top:0}
.date{border:2px solid var(--line);border-radius:8px;text-align:center;padding:2px 0;line-height:1.1}
.date small{display:block;font-size:11px;text-transform:uppercase;color:var(--muted)}
.date b{font-family:var(--f-display);font-size:22px}
.bill .info{min-width:0}
.bill .name{font-weight:600;overflow-wrap:anywhere}
.bill .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.chip.late{background:var(--late-bg);color:var(--late)} .chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.due{background:var(--sign);color:var(--sign-ink)} .chip.soft{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip.warn{background:var(--warn-bg);color:var(--ink)}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tag.q1{color:var(--q1)} .tag.q2{color:var(--q2)} .tag.wk{color:var(--wk)}
.bill.is-paid .name{text-decoration:line-through;color:var(--muted)}
.bill.is-late .date{border-color:var(--late)}
.bill.is-soon .date{border-color:var(--sign)}
.pay{border:2px solid var(--ink);background:transparent;color:var(--ink);font:600 14px var(--f-body);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:44px;white-space:nowrap}
.pay.done{border-color:var(--ok);background:var(--ok);color:#fff}
.btn{border:0;background:var(--ink);color:var(--surface);font:600 15px var(--f-body);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
.btn.sign{background:var(--sign);color:var(--sign-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--late);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.pay:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
a{color:inherit}
.linkbtn{font-size:13px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:4px 0;cursor:pointer;font-family:var(--f-body)}
.alert{border-left:5px solid var(--late);background:var(--late-bg)}
.alert h3{color:var(--late)}
.hint{background:var(--warn-bg);border-color:transparent}
.empty{text-align:center;color:var(--muted);padding:12px 0}
.grouphead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding-top:4px;border-top:3px solid var(--line)}
.grouphead.q1{border-top-color:var(--q1)} .grouphead.q2{border-top-color:var(--q2)} .grouphead.wk{border-top-color:var(--wk)}
.grouphead h3{color:var(--ink);padding-top:8px}
form.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.grid .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select{font:500 16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:600 14px var(--f-body);padding:10px 6px;min-height:44px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--surface)}
details{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
summary{cursor:pointer;font-weight:600;font-size:14px}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.months label{font-size:12px}
.months input{padding:8px;min-height:40px}
.big{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1}
.bar{position:relative;height:18px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:999px}
.bar.adv i{background:var(--sign)}
.ticks{position:relative;height:30px;font-size:11px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap;text-align:center}
.ticks span:last-child{transform:translateX(-100%)}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.step:first-child{border-top:0}
.step .n{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px}
.step.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.step.now .n{background:var(--sign);border-color:var(--sign);color:var(--sign-ink)}
.step b{display:block}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.block{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.block.q1{border-top:4px solid var(--q1)} .block.q2{border-top:4px solid var(--q2)}
.block b{font-family:var(--f-display);font-size:26px;line-height:1}
.chart{width:100%;height:auto;display:block}
.relief{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.relief:first-child{border-top:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:640px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 12px;text-decoration:none;color:var(--muted);font:700 14px var(--f-display);text-transform:uppercase;letter-spacing:.06em}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--sign)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--late-bg);border-radius:8px;padding:10px}
@media (max-width:380px){.tot b{font-size:20px}.bill{grid-template-columns:46px 1fr auto;gap:8px}.blocks{grid-template-columns:1fr}.months{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .5s ease}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1><span class="plate">Corre</span> em dia</h1>
      <div class="sync" id="sync">carregando…</div>
    </div>
    <div id="weekhead"></div>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>

<nav class="tabs" aria-label="Seções"><div class="in">
  <a href="#semana" data-tab="semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Semana</a>
  <a href="#contas" data-tab="contas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Contas</a>
  <a href="#reserva" data-tab="reserva"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg>Plano</a>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const DIAS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const DIAS_LONGOS=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const LS="corre-em-dia-v1";
const brl=v=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const brl0=v=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const ymLabel=ym=>{const[y,m]=ym.split("-");return MESES[+m-1]+"/"+y};
const isoDay=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const noon=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addMonthsYm=(ym,n)=>{const[y,m]=ym.split("-").map(Number);return ymOf(new Date(y,m-1+n,1))};
const uid=()=>Math.random().toString(36).slice(2,10);
const money=v=>v===""||v==null?"":String(v).replace(".",",");

function blank(){return{v:3,contas:[],metas:[],pagos:{},reserva:{saldo:0,movs:[]},config:{rendaSemanal:0,variaveisSemana:0,adiantamento:0}}}
function normalize(d){
  // dados do banco chegam congelados: copiar tudo antes de mexer
  const s=Object.assign(blank(),d?JSON.parse(JSON.stringify(d)):{});
  s.contas=Array.isArray(s.contas)?s.contas:[];
  for(const c of s.contas){if(!c.tipo)c.tipo="mensal";if(!c.valores||typeof c.valores!=="object")c.valores={}}
  s.metas=Array.isArray(s.metas)?s.metas:[];
  for(const m of s.metas){if(!Array.isArray(m.movs))m.movs=[];m.guardado=+m.guardado||0}
  s.pagos=s.pagos&&typeof s.pagos==="object"?s.pagos:{};
  s.reserva=Object.assign({saldo:0,movs:[]},s.reserva||{});
  if(!Array.isArray(s.reserva.movs))s.reserva.movs=[];
  s.config=Object.assign({rendaSemanal:0,variaveisSemana:0,adiantamento:0},s.config||{});
  return s;
}
let state=blank();
let tab="semana", weekOffset=0, contasMes=0, editing=null, confirmDel=null, tipoForm="mensal", editMeta=null, confirmMeta=null;
let db=null, ref=null, writing=false, dirty=false, saveTimer=null, loaded=false;

/* ---------- regras ---------- */
const semanal=c=>c.tipo==="semanal";
const bloco=c=>semanal(c)?"wk":(+c.dia<=15?"q1":"q2");
const BLOCO={wk:"Toda semana",q1:"Bloco do dia 15",q2:"Bloco do dia 30"};
const ativa=(c,ym)=>(!c.inicio||ym>=c.inicio)&&(!c.fim||ym<=c.fim);
const valorEm=(c,ym)=>Object.prototype.hasOwnProperty.call(c.valores||{},ym)?+c.valores[ym]:+c.valor||0;
const adiant=()=>Math.max(0,+state.config.adiantamento||0);
const metaDia=c=>+c.dia<=15?1:15;
const precisa=()=>state.contas.filter(c=>!semanal(c)).reduce((mx,c)=>Math.max(mx,Math.min(+c.dia,31)-metaDia(c)),0)||14;
function dueIn(c,y,m){return new Date(y,m,Math.min(Number(c.dia)||1,dim(y,m)),12)}
function planIn(c,y,m){const d=Math.min(Number(c.dia)||1,dim(y,m));return new Date(y,m,Math.max(metaDia(c),d-adiant()),12)}
function occurrences(start,end){
  const out=[];
  let y=start.getFullYear(),m=start.getMonth();const endYm=ymOf(end);
  for(let g=0;g<40;g++){
    const ym=y+"-"+pad(m+1);if(ym>endYm)break;
    for(const c of state.contas){
      if(semanal(c)||!ativa(c,ym))continue;
      const v=valorEm(c,ym);if(!(v>0))continue;
      const venc=dueIn(c,y,m),d=planIn(c,y,m);
      if(d>=start&&d<=end){const key=c.id+"|"+ym;out.push({c,d,venc,ym,key,v,pago:!!state.pagos[key]})}
    }
    m++;if(m>11){m=0;y++}
  }
  for(let d=noon(start);d<=end;d=addDays(d,1)){
    for(const c of state.contas){
      if(!semanal(c)||d.getDay()!==(+c.diaSemana||0))continue;
      const ym=ymOf(d);if(!ativa(c,ym))continue;const v=valorEm(c,ym);if(!(v>0))continue;
      const key=c.id+"|"+isoDay(d);out.push({c,d,venc:d,ym,key,v,pago:!!state.pagos[key]});
    }
  }
  return out.sort((a,b)=>a.d-b.d||a.c.nome.localeCompare(b.c.nome));
}
function weekRange(off){
  const t=noon(new Date());const dow=(t.getDay()+6)%7;
  const mon=addDays(t,-dow+off*7);
  const start=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate(),0,0,0);
  const end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+6,23,59,59);
  return{start,end};
}
function atrasadas(){
  const t=new Date();const today0=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  let start=new Date(t.getFullYear(),t.getMonth()-3,1);
  const desde=state.config.desde||"2026-11-01";const[dy,dm,dd]=desde.split("-").map(Number);const ds=new Date(dy,dm-1,dd);if(ds>start)start=ds;
  const end=new Date(t.getFullYear(),t.getMonth()+1,0,23,59,59);
  return occurrences(start,end).filter(o=>!o.pago&&!semanal(o.c)&&o.venc<today0);
}
const daysUntil=d=>Math.round((noon(d)-noon(new Date()))/864e5);
/* quantas vezes o dia da semana (0=dom..6=sáb) aparece no mês */
function vezesNoMes(ym,dow){const[y,m]=ym.split("-").map(Number);let n=0;for(let d=1;d<=dim(y,m-1);d++)if(new Date(y,m-1,d).getDay()===dow)n++;return n}
const semanalNoMes=(c,ym)=>ativa(c,ym)?valorEm(c,ym)*vezesNoMes(ym,+c.diaSemana||0):0;
const semanalMensal=ym=>state.contas.filter(semanal).reduce((s,c)=>s+semanalNoMes(c,ym),0);
function semanalPagoNoMes(c,ym){const[y,m]=ym.split("-").map(Number);let s=0;for(let d=1;d<=dim(y,m-1);d++){const dt=new Date(y,m-1,d);if(dt.getDay()===(+c.diaSemana||0)&&state.pagos[c.id+"|"+isoDay(dt)])s+=valorEm(c,ym)}return s}
/* metas: gasto novo (ex.: aluguel) entra a partir do mês da meta */
const gastoMetas=ym=>state.metas.filter(m=>m.gastoMensal>0&&m.alvo&&ym>=m.alvo).reduce((s,m)=>s+(+m.gastoMensal),0);
const custoMensalContas=ym=>state.contas.filter(c=>!semanal(c)&&ativa(c,ym)).reduce((s,c)=>s+valorEm(c,ym),0)+semanalMensal(ym)+gastoMetas(ym);
const custoVidaMensal=()=>{
  const ym=ymOf(new Date());
  const fixas=state.contas.filter(c=>!semanal(c)&&!c.fim).reduce((s,c)=>s+(+c.valor||0),0);
  const futuros=state.metas.reduce((s,m)=>s+(+m.gastoMensal||0),0);
  return fixas+semanalMensal(ym)+(+state.config.variaveisSemana||0)*52/12+futuros;
};
function metaInfo(m){
  const t=noon(new Date());const[ay,am]=(m.alvo||ymOf(t)).split("-").map(Number);const alvo=new Date(ay,am-1,1,12);
  const falta=Math.max(0,(+m.valor||0)-(+m.guardado||0));
  const semanas=Math.max(1,Math.ceil((alvo-t)/(7*864e5)));
  const vencida=alvo<=t;
  const porSemana=falta>0?falta/semanas:0;
  // ritmo: quanto já deveria ter, contando da criação até o mês alvo
  const ini=m.criado?new Date(m.criado+"T12:00:00"):t;
  const totalDias=Math.max(1,(alvo-ini)/864e5),passou=Math.min(totalDias,Math.max(0,(t-ini)/864e5));
  const esperado=(+m.valor||0)*passou/totalDias;
  return{falta,semanas,porSemana,porMes:porSemana*52/12,vencida,ok:falta<=0,atras:(+m.guardado||0)+1<esperado,esperado};
}
const metasMensalAte=ym=>state.metas.reduce((s,m)=>{const i=metaInfo(m);return s+(!i.ok&&m.alvo&&ym<m.alvo?i.porMes:0)},0);

/* ---------- salvar ---------- */
function persist(){
  if(!db){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}setSync("salvo neste aparelho");return}
  dirty=true;setSync("salvando…");clearTimeout(saveTimer);saveTimer=setTimeout(flush,350);
}
async function flush(){
  if(writing)return;writing=true;
  while(dirty){dirty=false;
    try{await ref.set(JSON.parse(JSON.stringify(state)));setSync("salvo ✓")}
    catch(e){setSync("não salvou");toast("Não consegui salvar ("+(e&&e.code||"erro")+"). Tente de novo.");break}
  }
  writing=false;
}
function setSync(t){document.getElementById("sync").textContent=t}

/* ---------- cabeçalho ---------- */
function renderHead(){

/* ---------- linha de conta ---------- */
function billRow(o,opts={}){
  const nv=daysUntil(o.venc),np=daysUntil(o.d);let chip;
  if(o.pago)chip=`<span class="chip ok">Pago</span>`;
  else if(nv<0)chip=`<span class="chip late">Atrasada ${-nv}d</span>`;
  else if(np<0)chip=`<span class="chip warn">passou do plano · vence em ${nv}d</span>`;
  else if(np===0)chip=`<span class="chip due">Pagar hoje</span>`;
  else if(np===1)chip=`<span class="chip due">Amanhã</span>`;
  else chip=`<span class="chip soft">em ${np} dias</span>`;
  const b=bloco(o.c);
  const vencTxt=semanal(o.c)?"":(isoDay(o.d)!==isoDay(o.venc)?`vence dia ${o.venc.getDate()}`:`vence hoje no plano`);
  const cls=o.pago?"is-paid":nv<0?"is-late":np<=1?"is-soon":"";
  return `<div class="bill ${cls}"><div class="date"><small>${DIAS[o.d.getDay()]}</small><b class="num">${o.d.getDate()}</b></div>
  <div class="info"><div class="name">${esc(o.c.nome)}</div><div class="meta"><span class="tag ${b}">${BLOCO[b]}</span><span class="num">${brl(o.v)}</span>${vencTxt&&isoDay(o.d)!==isoDay(o.venc)?`<span>${vencTxt}</span>`:""}${chip}</div></div>
  <button class="pay${o.pago?" done":""}" data-act="pay" data-key="${o.key}" data-v="${o.v}">${o.pago?"✓ Pago":(opts.adiantar?"Adiantar":"Paguei")}</button></div>`;
}

function renderSemana(){

  html+=`<div class="card"><div class="totals"><div class="tot"><span>Semana</span><b class="num">${brl0(total)}</b></div><div class="tot pago"><span>Pago</span><b class="num">${brl0(pago)}</b></div><div class="tot falta"><span>Falta</span><b class="num">${brl0(total-pago)}</b></div></div></div>`;

  html+=`<div class="card"><div class="spread"><h2>Toda semana</h2><b class="num">${brl0(sum(wk))}</b></div>
  <div>${wk.length?wk.map(o=>billRow(o)).join(""):`<p class="empty">Cadastre alimentação, imprevisto e aluguel da moto como “Toda semana”.</p>`}</div></div>`;
  if(weekOffset===0){
    const nx=weekRange(1),nocc=occurrences(nx.start,nx.end).filter(o=>!o.pago&&!semanal(o.c));

function gcalLink(c){
  const f=x=>x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate());
  const t=noon(new Date());let d,rule;
  if(semanal(c)){d=addDays(t,((+c.diaSemana||0)-t.getDay()+7)%7);rule="RRULE:FREQ=WEEKLY";}
  else{let y=t.getFullYear(),m=t.getMonth();d=dueIn(c,y,m);if(d<t){m++;if(m>11){m=0;y++}d=dueIn(c,y,m)}
    if(c.inicio&&ymOf(d)<c.inicio){const[iy,im]=c.inicio.split("-").map(Number);d=dueIn(c,iy,im-1)}
    rule="RRULE:FREQ=MONTHLY;BYMONTHDAY="+(Number(c.dia)>=31?-1:Number(c.dia));}
  if(c.fim){const[fy,fm]=c.fim.split("-").map(Number);rule+=";UNTIL="+f(new Date(fy,fm,0))}
  const p=new URLSearchParams({action:"TEMPLATE",text:"Pagar: "+c.nome,dates:f(d)+"/"+f(addDays(d,1)),details:"Lembrete do Corre em Dia. Confira o valor do mês no app.",recur:rule});
  return "https://calendar.google.com/calendar/render?"+p.toString();
}

const MESES_LONGOS=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function statusMes(c,ym){
  if(!ativa(c,ym)||!(valorEm(c,ym)>0))return{none:true,chip:`<span class="chip soft">nada neste mês</span>`};
  if(semanal(c)){const n=vezesNoMes(ym,+c.diaSemana||0);return{chip:`<span class="chip soft">${n}× ${DIAS_LONGOS[+c.diaSemana||0]} = ${brl0(semanalNoMes(c,ym))} no mês</span>`}}
  const[y,m]=ym.split("-").map(Number);const venc=dueIn(c,y,m-1),plan=planIn(c,y,m-1);
  const key=c.id+"|"+ym;
  if(state.pagos[key])return{key,pago:true,chip:`<span class="chip ok">✓ pago</span>`};
  const nv=daysUntil(venc),np=daysUntil(plan);
  if(nv<0)return{key,chip:`<span class="chip late">venceu dia ${venc.getDate()}</span>`};
  if(nv===0)return{key,chip:`<span class="chip due">vence hoje</span>`};
  if(np<=0)return{key,chip:`<span class="chip due">pagar agora · vence em ${nv}d</span>`};
  return{key,chip:`<span class="chip soft">pagar em ${np} dia${np===1?"":"s"}</span>`};
}
function contaCard(c,ym){

  const plano=semanal(c)?"":`<span>pagar dia ${Math.max(metaDia(c),+c.dia-adiant())} · meta dia ${metaDia(c)}</span>`;

  ${confirmDel===c.id?`<div class="confirm"><span class="small">Apagar “${esc(c.nome)}” e o histórico de pagamentos?</span><button class="btn danger" data-act="delok" data-id="${c.id}">Apagar</button><button class="btn ghost" data-act="delno">Manter</button></div>`:""}
  </div>${st.key?`<button class="pay${st.pago?" done":""}" data-act="pay" data-key="${st.key}" data-v="${valorEm(c,ym)}">${st.pago?"✓ Pago":"Paguei"}</button>`:"<span></span>"}</div>`;
}

/* ---------- aba plano ---------- */
function projecao(){
  const renda=(+state.config.rendaSemanal||0)*52/12,varM=(+state.config.variaveisSemana||0)*52/12;
  const meta=custoVidaMensal()*3;let saldo=+state.reserva.saldo||0;const ym0=ymOf(new Date());
  const pts=[{ym:ym0,saldo}];let hit=saldo>=meta&&meta>0?ym0:null;
  for(let i=1;i<=48;i++){const ym=addMonthsYm(ym0,i);saldo=Math.max(0,saldo+renda-varM-custoMensalContas(ym)-metasMensalAte(ym));pts.push({ym,saldo});if(!hit&&meta>0&&saldo>=meta)hit=ym}
  return{pts,meta,hit};
}
function chart(pts,meta){
  const W=340,H=170,L=44,R=10,T=14,B=26;const n=pts.length-1;
  const max=Math.max(meta*1.15,...pts.map(p=>p.saldo),1);
  const x=i=>L+(W-L-R)*i/n,y=v=>T+(H-T-B)*(1-v/max);
  const line=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.saldo).toFixed(1)).join(" ");
  const area=line+` L${x(n)} ${y(0)} L${x(0)} ${y(0)} Z`;
  let grid="";for(let k=0;k<=2;k++){const v=max*k/2;grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v>=1000?Math.round(v/1000)+"mil":Math.round(v)}</text>`}
  let xl="";for(let i=0;i<=n;i+=12){xl+=`<text x="${x(i)}" y="${H-8}" text-anchor="${i===0?"start":i===n?"end":"middle"}" font-size="10" fill="var(--muted)">${ymLabel(pts[i].ym)}</text>`}
  const last=pts[n];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Projeção da reserva nos próximos 4 anos">${grid}
  <path d="${area}" fill="var(--ok)" fill-opacity=".15"/><path d="${line}" fill="none" stroke="var(--ok)" stroke-width="2.5"/>
  <line x1="${L}" x2="${W-R}" y1="${y(meta)}" y2="${y(meta)}" stroke="var(--sign)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="${W-R}" y="${y(meta)-5}" text-anchor="end" font-size="10" font-weight="700" fill="var(--ink)">meta 3 meses</text>
  <circle cx="${x(n)}" cy="${y(last.saldo)}" r="4" fill="var(--ok)"/>${xl}</svg>`;
}
function mesPassadoNoPlano(){
  const t=new Date();const s=new Date(t.getFullYear(),t.getMonth()-1,1),e=new Date(t.getFullYear(),t.getMonth(),0,23,59,59);
  const occ=occurrences(s,e).filter(o=>!semanal(o.c));
  return occ.length>0&&occ.every(o=>o.pago&&state.pagos[o.key].em<=isoDay(o.d));
}
function renderAdiant(){

  const sugere=mesPassadoNoPlano()&&a<need;
  return `<div class="card"><div class="spread"><h2>Adiantar pagamentos</h2><span class="chip ${a>=need?"ok":"soft"}">${a>=need?"meta atingida":a+" de "+need+" dias"}</span></div>

  <div class="bar adv"><i style="width:${pct.toFixed(1)}%"></i></div>
  <div class="blocks"><div class="block q1"><span class="tag q1">Bloco do dia 15</span><b class="num">${faixa("q1")}</b><span class="small muted">meta: dia 1</span></div>
  <div class="block q2"><span class="tag q2">Bloco do dia 30</span><b class="num">${faixa("q2")}</b><span class="small muted">meta: dia 15</span></div></div>
  ${sugere?`<p class="small" style="background:var(--ok-bg);padding:10px;border-radius:8px">O mês passado foi pago todo dentro do plano. Dá para adiantar mais 2 dias.</p>`:""}
  <div class="row"><button class="btn ghost" data-act="adv" data-n="-1" ${a<=0?"disabled":""}>− 1 dia</button><button class="btn sign" data-act="adv" data-n="2" ${a>=need?"disabled":""}>Adiantar +2 dias</button><button class="btn ghost" data-act="adv" data-n="1" ${a>=need?"disabled":""}>+ 1 dia</button></div></div>`;
}
function renderMetaForm(){
  const m=editMeta&&editMeta!=="new"?state.metas.find(x=>x.id===editMeta):null;
  const v=m||{nome:"",valor:"",alvo:"",gastoMensal:""};
  return `<form class="grid" id="fmeta">
    <label class="full">Nome da meta<input id="g-nome" required maxlength="60" value="${esc(v.nome)}" placeholder="Ex.: Mudança para aluguel"></label>
    <label>Quanto precisa (R$)<input id="g-valor" required inputmode="decimal" value="${esc(money(v.valor))}" placeholder="6000"></label>
    <label>Para quando<input id="g-alvo" required type="month" value="${esc(v.alvo||"")}"></label>
    <label class="full">Depois disso, gasto novo por mês (opcional)<input id="g-gasto" inputmode="decimal" value="${esc(money(v.gastoMensal||""))}" placeholder="Ex.: aluguel 900"></label>
    <p class="small muted full">O gasto novo entra nas contas a partir do mês da meta e aumenta a meta da reserva.</p>
    <div class="full row"><button class="btn sign" type="submit">Salvar meta</button><button class="btn ghost" type="button" data-act="mcancel">Cancelar</button></div></form>`;
}
function renderMetas(){
  let html=`<div class="card"><div class="spread"><h2>Metas</h2>${editMeta?"":`<button class="btn ghost" data-act="mnew">+ Nova meta</button>`}</div>
  <p class="small muted">Dinheiro separado para um objetivo com data, fora da reserva de emergência.</p>`;
  if(editMeta==="new")html+=renderMetaForm();
  if(!state.metas.length&&!editMeta)html+=`<p class="empty">Nenhuma meta. Exemplo: R$ 6.000 de móveis e caução para julho.</p>`;
  for(const m of state.metas){
    if(editMeta===m.id){html+=renderMetaForm();continue}
    const i=metaInfo(m),pct=m.valor>0?Math.min(100,m.guardado/m.valor*100):0;
    const st=i.ok?`<span class="chip ok">Completa</span>`:i.vencida?`<span class="chip late">Prazo chegou · falta ${brl0(i.falta)}</span>`:i.atras?`<span class="chip warn">Abaixo do ritmo</span>`:`<span class="chip ok">No ritmo</span>`;
    html+=`<div class="block" style="gap:8px">
      <div class="spread"><b style="font-family:var(--f-body);font-size:16px;line-height:1.3">${esc(m.nome)}</b>${st}</div>
      <div class="spread small"><span class="muted">${brl0(m.guardado)} de ${brl0(m.valor)}</span><span class="muted">até ${ymLabel(m.alvo)}</span></div>
      <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
      ${i.ok?"":`<p class="small">Guarde <b class="num">${brl0(i.porSemana)}</b> por semana (${brl0(i.porMes)}/mês) por ${i.semanas} semana${i.semanas===1?"":"s"}.</p>`}
      ${m.gastoMensal>0?`<p class="small muted">A partir de ${ymLabel(m.alvo)}: +${brl0(m.gastoMensal)}/mês nas contas.</p>`:""}
      <form class="row" data-meta="${m.id}"><label style="flex:1 1 120px">Valor (R$)<input id="mm-${m.id}" inputmode="decimal" placeholder="100,00"></label>
      <div class="row" style="align-self:flex-end"><button class="btn sign" type="submit">Guardei</button><button class="btn ghost" type="button" data-act="mtirar" data-id="${m.id}">Tirei</button></div></form>
      <div class="row" style="gap:14px"><button class="linkbtn" data-act="medit" data-id="${m.id}">Editar</button><button class="linkbtn" data-act="mdel" data-id="${m.id}">Apagar</button></div>
      ${confirmMeta===m.id?`<div class="confirm"><span class="small">Apagar a meta “${esc(m.nome)}”? O valor guardado nela some do app.</span><button class="btn danger" data-act="mdelok" data-id="${m.id}">Apagar</button><button class="btn ghost" data-act="mdelno">Manter</button></div>`:""}
    </div>`;
  }
  const tot=state.metas.reduce((s,m)=>s+metaInfo(m).porSemana,0);
  if(tot>0)html+=`<div class="spread"><span class="muted">Total das metas por semana</span><b class="num">${brl0(tot)}</b></div>`;
  return html+`</div>`;
}
function metaMov(id,dir){
  const m=state.metas.find(x=>x.id===id);const el=document.getElementById("mm-"+id);const v=parseMoney(el&&el.value);
  if(!m)return;if(!(v>0)){toast("Digite um valor, ex.: 100,00");return}
  m.guardado=Math.round(((+m.guardado||0)+dir*v)*100)/100;m.movs.push({data:isoDay(new Date()),valor:dir*v});
  if(m.movs.length>200)m.movs=m.movs.slice(-200);persist();render();toast(dir>0?"Guardado em “"+m.nome+"”":"Retirada registrada");
}
function renderReserva(){
  const saldo=+state.reserva.saldo||0,mes=custoVidaMensal(),meta=mes*3;
  const pct=meta>0?Math.min(100,saldo/meta*100):0;
  const late=atrasadas().length,need=precisa(),a=adiant();
  const steps=[
    {t:"Nada atrasado",d:late?`${late} conta(s) vencida(s) sem pagar. Isso vem antes de guardar: juros comem a reserva.`:"Todas as contas vencidas estão pagas.",ok:!late},
    {t:"Contas adiantadas",d:a>=need?"Bloco do dia 15 pago no dia 1 e bloco do dia 30 no dia 15.":`Hoje você paga ${a} dia(s) antes do vencimento. Meta: ${need} dias.`,ok:a>=need},
    {t:"1 mês guardado",d:`Meta: ${brl0(mes)} (contas fixas + gastos da semana).`,ok:mes>0&&saldo>=mes},
    {t:"3 meses guardados",d:`Meta: ${brl0(meta)}. Cobre moto quebrada, doença ou semana sem entrega.`,ok:meta>0&&saldo>=meta},
  ];
  const nowIdx=steps.findIndex(s=>!s.ok);
  const renda=+state.config.rendaSemanal||0,varS=+state.config.variaveisSemana||0;
  const contasSem=custoMensalContas(ymOf(new Date()))*12/52;
  const metasSem=state.metas.reduce((s,m)=>s+metaInfo(m).porSemana,0);
  const sobraSem=renda-varS-contasSem-metasSem;
  const pj=projecao();const ym0=ymOf(new Date());
  const alivios=state.contas.filter(c=>c.fim&&c.fim>=ym0).sort((x,y)=>x.fim.localeCompare(y.fim));
  const movs=[...state.reserva.movs].slice(-8).reverse();
  let html=`<div class="card"><h2>A escada</h2><div>${steps.map((s,i)=>`<div class="step ${s.ok?"done":i===nowIdx?"now":""}"><span class="n">${s.ok?"✓":i+1}</span><div><b>${s.t}</b><span class="small muted">${esc(s.d)}</span></div></div>`).join("")}</div></div>`;
  html+=renderAdiant();
  html+=renderMetas();
  html+=`<div class="card"><h3>Reserva de emergência</h3><div class="big num">${brl(saldo)}</div>
  <div class="bar" aria-label="Progresso da meta"><i style="width:${pct.toFixed(1)}%"></i></div>
  <div class="ticks num"><span style="left:0;transform:none">0</span><span style="left:33.3%">1 mês<br>${brl0(mes)}</span><span style="left:66.6%">2 meses</span><span style="left:100%">3 meses<br>${brl0(meta)}</span></div>
  <form class="row" id="fmov"><label style="flex:1 1 140px">Valor (R$)<input id="m-valor" inputmode="decimal" placeholder="50,00" required></label>
  <div class="row" style="align-self:flex-end"><button class="btn sign" type="submit">Guardei</button><button class="btn ghost" type="button" data-act="tirar">Tirei</button></div></form></div>`;
  html+=`<div class="card"><h2>Seu corre por semana</h2>
  <form class="grid" id="fcfg"><label>Ganho médio na semana<input id="c-renda" inputmode="decimal" value="${renda?money(renda):""}" placeholder="Ex.: 1200"></label>
  <label>Outros gastos (gasolina…)<input id="c-var" inputmode="decimal" value="${varS?money(varS):""}" placeholder="Ex.: 150"></label>
  <div class="full"><button class="btn ghost" type="submit">Atualizar plano</button></div></form>`;
  if(renda>0){
    html+=`<div class="spread"><span class="muted">Contas + gastos semanais (média/semana)</span><b class="num">${brl0(contasSem)}</b></div>
    ${metasSem>0?`<div class="spread"><span class="muted">Metas (por semana)</span><b class="num">${brl0(metasSem)}</b></div>`:""}
    <div class="spread"><span class="muted">Sobra para a reserva por semana</span><b class="num" style="color:${sobraSem>=0?"var(--ok)":"var(--late)"}">${brl0(sobraSem)}</b></div>`;
    html+=sobraSem<=0?`<p class="small">Hoje as contas passam do que entra. Foque no degrau 1 e veja abaixo quando cada parcela acaba: é nesses meses que a sobra aparece.</p>`
      :`<p class="small">Separe <b class="num">${brl0(sobraSem)}</b> toda semana. Primeiro use para adiantar contas, depois mande para a reserva.</p>`;
    html+=`<div><h3 style="margin-bottom:6px">Projeção da reserva</h3>${chart(pj.pts,pj.meta)}<p class="small" style="margin-top:6px">${pj.meta<=0?"Cadastre contas para calcular a meta.":pj.hit?`No ritmo atual você chega aos 3 meses em <b>${ymLabel(pj.hit)}</b>.`:"No ritmo atual a meta não chega em 4 anos. Aumentar a sobra ou quitar parcelas muda isso."}</p></div>`;
  } else html+=`<p class="small muted">Preencha quanto você ganha numa semana normal para ver a sobra e em que mês chega aos 3 meses de reserva.</p>`;
  html+=`</div>`;
  if(alivios.length)html+=`<div class="card"><h2>Quando o aperto alivia</h2><div>${alivios.map(c=>`<div class="relief"><span>${esc(c.nome)} <span class="muted">· última em ${ymLabel(c.fim)}</span></span><b class="num" style="color:var(--ok)">+${brl0(valorEm(c,c.fim))}/mês</b></div>`).join("")}</div></div>`;
  if(movs.length)html+=`<div class="card"><h3>Últimos movimentos</h3><div>${movs.map(m=>`<div class="relief"><span class="muted">${m.data.split("-").reverse().join("/")}</span><b class="num" style="color:${m.valor>=0?"var(--ok)":"var(--late)"}">${m.valor>=0?"+":""}${brl(m.valor)}</b></div>`).join("")}</div></div>`;
  html+=renderBackup();
  return html;
}

/* ---------- backup ---------- */
let importPend=null;
function renderBackup(){
  const ult=state.config.ultimoBackup;
  const dias=ult?Math.round((noon(new Date())-new Date(ult+"T12:00:00"))/864e5):null;
  const aviso=!state.contas.length?"":ult==null?`<span class="chip warn">nunca fez backup</span>`:dias>30?`<span class="chip warn">último há ${dias} dias</span>`:`<span class="chip ok">último em ${ult.split("-").reverse().join("/")}</span>`;
  return `<div class="card"><div class="spread"><h2>Backup</h2>${aviso}</div>
  <p class="small muted">Os dados ficam só neste celular. Salve um backup de vez em quando (mande para você no WhatsApp ou no Drive). Se trocar de celular ou limpar o navegador, é ele que traz tudo de volta.</p>
  <div class="row"><button class="btn sign" data-act="exportar">Salvar backup</button>
  <label class="btn ghost" style="flex-direction:row;align-items:center;color:var(--ink);font-size:15px">Restaurar backup<input type="file" id="f-import" accept=".json,application/json" hidden></label></div>
  ${importPend?`<div class="confirm"><span class="small">Restaurar o backup de ${esc(importPend.data)} com ${importPend.s.contas.length} contas? Isso troca tudo o que está neste celular.</span><button class="btn danger" data-act="importok">Restaurar</button><button class="btn ghost" data-act="importno">Cancelar</button></div>`:""}</div>`;
}
function exportar(){
  state.config.ultimoBackup=isoDay(new Date());persist();
  const blob=new Blob([JSON.stringify({app:"corre-em-dia",exportado:new Date().toISOString(),estado:state},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="corre-em-dia-backup-"+isoDay(new Date())+".json";
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  render();toast("Backup salvo em Downloads");
}
document.addEventListener("change",e=>{
  if(e.target.id!=="f-import")return;const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);const raw=j.estado||j.data||j;if(!Array.isArray(raw.contas))throw 0;
      importPend={s:normalize(raw),data:j.exportado?new Date(j.exportado).toLocaleDateString("pt-BR"):"arquivo"};render()}
    catch(err){toast("Esse arquivo não é um backup do Corre em Dia")}};
  r.readAsText(f);
});

/* ---------- render e eventos ---------- */
function render(){
  document.querySelectorAll("nav.tabs a").forEach(a=>a.classList.toggle("on",a.dataset.tab===tab));
  try{renderHead()}catch(err){document.getElementById("weekhead").innerHTML=""}
  const v=document.getElementById("view");
  if(!loaded){v.innerHTML=`<div class="card"><p class="empty">Carregando suas contas…</p></div>`;return}
  try{v.innerHTML=tab==="semana"?renderSemana():tab==="contas"?renderContas():renderReserva()}
  catch(err){v.innerHTML=`<div class="card alert"><h3>Algo deu errado</h3><p class="small">Mande este texto para o Claude: ${esc(err&&err.message||err)}</p></div>`}
}
const parseMoney=s=>{s=String(s??"").trim().replace(/[R$\s]/g,"");if(s==="")return NaN;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:NaN};
function readForm(){const g=id=>{const el=document.getElementById(id);return el?el.value:""};const out={nome:g("f-nome"),valor:g("f-valor"),dia:g("f-dia"),fim:g("f-fim"),inicio:g("f-inicio"),ds:g("f-ds"),meses:{}};for(const ym of monthWindow())out.meses[ym]=g("fv-"+ym);return out}
function restoreForm(v){const set=(id,val)=>{const el=document.getElementById(id);if(el)el.value=val};set("f-nome",v.nome);set("f-valor",v.valor);set("f-dia",v.dia);set("f-fim",v.fim);set("f-inicio",v.inicio);set("f-ds",v.ds);for(const[k,val]of Object.entries(v.meses))set("fv-"+k,val)}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==="wk"){weekOffset+=+b.dataset.n;render();return}
  if(a==="cm"){contasMes+=+b.dataset.n;confirmDel=null;render();return}
  if(a==="pay"){const k=b.dataset.key;if(state.pagos[k]){delete state.pagos[k];toast("Desmarcado")}else{state.pagos[k]={em:isoDay(new Date()),valor:+b.dataset.v};toast("Marcado como pago")}persist();render();return}
  if(a==="new"){editing="new";tipoForm="mensal";confirmDel=null;render();return}
  if(a==="edit"){editing=b.dataset.id;const c=state.contas.find(x=>x.id===editing);tipoForm=c?(semanal(c)?"semanal":c.fim?"parc":"mensal"):"mensal";confirmDel=null;render();scrollTo({top:0});return}
  if(a==="cancel"){editing=null;render();return}
  if(a==="tipo"){const keep=readForm();tipoForm=b.dataset.t;render();restoreForm(keep);return}
  if(a==="del"){confirmDel=b.dataset.id;render();return}
  if(a==="delno"){confirmDel=null;render();return}
  if(a==="delok"){const id=b.dataset.id;state.contas=state.contas.filter(c=>c.id!==id);for(const k of Object.keys(state.pagos))if(k.startsWith(id+"|"))delete state.pagos[k];confirmDel=null;persist();render();toast("Conta apagada");return}
  if(a==="adv"){state.config.adiantamento=Math.min(precisa(),Math.max(0,adiant()+(+b.dataset.n)));persist();render();toast("Agora: "+adiant()+" dia(s) antes do vencimento");return}
  if(a==="tirar"){mov(-1);return}
  if(a==="exportar"){exportar();return}
  if(a==="importno"){importPend=null;render();return}
  if(a==="importok"){state=importPend.s;importPend=null;persist();render();toast("Backup restaurado");return}
  if(a==="mnew"){editMeta="new";confirmMeta=null;render();return}
  if(a==="medit"){editMeta=b.dataset.id;confirmMeta=null;render();return}
  if(a==="mcancel"){editMeta=null;render();return}
  if(a==="mdel"){confirmMeta=b.dataset.id;render();return}
  if(a==="mdelno"){confirmMeta=null;render();return}
  if(a==="mdelok"){state.metas=state.metas.filter(m=>m.id!==b.dataset.id);confirmMeta=null;persist();render();toast("Meta apagada");return}
  if(a==="mtirar"){metaMov(b.dataset.id,-1);return}
  if(a==="copy"){const{start,end}=weekRange(weekOffset);const occ=occurrences(start,end);
    const txt="Pagar "+start.getDate()+"/"+(start.getMonth()+1)+" a "+end.getDate()+"/"+(end.getMonth()+1)+":\n"+occ.map(o=>(o.pago?"[x] ":"[ ] ")+DIAS[o.d.getDay()]+" "+o.d.getDate()+" – "+o.c.nome+" – "+brl(o.v)).join("\n");
    try{await navigator.clipboard.writeText(txt);toast("Lista copiada")}catch(err){toast("Não deu para copiar aqui")}return}
});
function mov(dir){const el=document.getElementById("m-valor");const v=parseMoney(el&&el.value);if(!(v>0)){toast("Digite um valor, ex.: 50,00");return}
  state.reserva.saldo=Math.round(((+state.reserva.saldo||0)+dir*v)*100)/100;state.reserva.movs.push({data:isoDay(new Date()),valor:dir*v});
  if(state.reserva.movs.length>200)state.reserva.movs=state.reserva.movs.slice(-200);persist();render();toast(dir>0?"Guardado na reserva":"Retirada registrada")}
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="fmov"){mov(1);return}
  if(f.dataset.meta){metaMov(f.dataset.meta,1);return}
  if(f.id==="fmeta"){const g=id=>document.getElementById(id).value;
    const nome=g("g-nome").trim(),valor=parseMoney(g("g-valor")),alvo=g("g-alvo"),gasto=parseMoney(g("g-gasto"));
    if(!nome){toast("Dê um nome para a meta");return}
    if(!(valor>0)){toast("Valor inválido. Ex.: 6000");return}
    if(!/^\d{4}-\d{2}$/.test(alvo)){toast("Escolha o mês da meta");return}
    const data={nome,valor,alvo,gastoMensal:gasto>0?gasto:0};
    if(editMeta==="new")state.metas.push(Object.assign({id:uid(),guardado:0,movs:[],criado:isoDay(new Date())},data));
    else{const m=state.metas.find(x=>x.id===editMeta);if(m)Object.assign(m,data)}
    editMeta=null;persist();render();toast("Meta salva");return}
  if(f.id==="fcfg"){state.config.rendaSemanal=parseMoney(document.getElementById("c-renda").value)||0;state.config.variaveisSemana=parseMoney(document.getElementById("c-var").value)||0;persist();render();toast("Plano atualizado");return}
  if(f.id==="fconta"){const v=readForm();const valor=parseMoney(v.valor),dia=parseInt(v.dia,10),wk=tipoForm==="semanal";
    if(!v.nome.trim()){toast("Dê um nome para a conta");return}
    if(!(valor>=0)){toast("Valor inválido. Use por exemplo 150,00");return}
    if(!wk&&!(dia>=1&&dia<=31)){toast("Dia do vencimento vai de 1 a 31");return}
    if(tipoForm==="parc"&&!v.fim){toast("Informe o mês da última parcela");return}
    const old=editing!=="new"?state.contas.find(x=>x.id===editing):null;
    const win=new Set(monthWindow());const valores={};
    if(old)for(const[k,val]of Object.entries(old.valores||{}))if(!win.has(k))valores[k]=val;
    for(const[k,raw]of Object.entries(v.meses)){const n=parseMoney(raw);if(n>=0)valores[k]=n}
    const data={nome:v.nome.trim(),valor,tipo:wk?"semanal":"mensal",dia:wk?null:dia,diaSemana:wk?+v.ds:null,fim:tipoForm==="parc"?v.fim:null,inicio:tipoForm==="parc"&&v.inicio?v.inicio:null,valores,revisar:false};
    if(!old)state.contas.push(Object.assign({id:uid()},data));else Object.assign(old,data);
    editing=null;persist();render();toast("Conta salva")}
});
function route(){const h=(location.hash||"").slice(1);tab=["semana","contas","reserva"].includes(h)?h:"semana";editing=null;confirmDel=null;render()}
addEventListener("hashchange",route);

route();
/* versão app (PWA): dados ficam só neste aparelho, no localStorage */
try{const raw=localStorage.getItem(LS);if(raw)state=normalize(JSON.parse(raw))}catch(e){toast("Não consegui ler os dados salvos")}
loaded=true;setSync("salvo neste celular");render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
